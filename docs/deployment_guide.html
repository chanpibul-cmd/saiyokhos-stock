            </div>
            <div class="p-2.5 bg-emerald-950/40 border border-emerald-800/60 rounded-lg text-emerald-300 text-xs text-center font-medium">
              🎉 ระบบบริหารคลังและสต๊อกพัสดุ โรงพยาบาลไทรโยค พร้อมใช้งานอย่างเป็นทางการ!
            </div>
          </div>
        `
      }
    ];

    let currentStep = 0;
    let isPlaying = false;
    let playInterval = null;

    function renderScene(step) {
      currentStep = step;
      const scene = SCENES[step];

      document.getElementById('player-title').textContent = scene.title;
      document.getElementById('player-time').textContent = scene.time;
      document.getElementById('scene-container').innerHTML = scene.html;
      document.getElementById('current-step-label').textContent = `ฉากที่ ${step + 1} / ${SCENES.length}`;

      const percentage = ((step + 1) / SCENES.length) * 100;
      document.getElementById('progress-bar').style.width = `${percentage}%`;

      document.querySelectorAll('.step-nav-btn').forEach((btn, index) => {
        if (index === step) {
          btn.classList.add('step-active');
          btn.classList.add('border-emerald-600');
        } else {
          btn.classList.remove('step-active');
          btn.classList.remove('border-emerald-600');
        }
      });
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      const icon = document.getElementById('play-icon');
      if (isPlaying) {
        icon.className = 'fa-solid fa-pause';
        playInterval = setInterval(() => {
          if (currentStep < SCENES.length - 1) {
            renderScene(currentStep + 1);
          } else {
            renderScene(0);
          }
        }, 7000);
      } else {
        icon.className = 'fa-solid fa-play';
        clearInterval(playInterval);
      }
    }

    document.getElementById('btn-play-pause').addEventListener('click', togglePlayPause);
    document.getElementById('btn-prev').addEventListener('click', () => { if (currentStep > 0) renderScene(currentStep - 1); });
    document.getElementById('btn-next').addEventListener('click', () => { if (currentStep < SCENES.length - 1) renderScene(currentStep + 1); });

    document.querySelectorAll('.step-nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseInt(btn.getAttribute('data-step'));
        renderScene(step);
      });
    });

    document.getElementById('btn-copy-code').addEventListener('click', () => {
      const cmd = SCENES[currentStep].command;
      navigator.clipboard.writeText(cmd).then(() => {
        const btn = document.getElementById('btn-copy-code');
        btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> <span>คัดลอกเรียบร้อย!</span>';
        setTimeout(() => {
          btn.innerHTML = '<i class="fa-solid fa-copy"></i> <span>คัดลอกคำสั่งในฉากนี้</span>';
        }, 2000);
      });
    });

    renderScene(0);
  </script>
</body>
</html>
